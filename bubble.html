<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wis Speech Bubble</title>
  <link rel="stylesheet" href="bubble.css">
</head>
<body>
  <div id="bubble-container" class="bubble-container">
    <!-- Progress Indicator (During search/analysis) -->
    <div id="bubble-progress" class="bubble-progress hidden">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div id="progress-text" class="progress-text">🔍 Sedang menelusuri...</div>
    </div>

    <!-- Pure Text Content (WhatsApp Bubble Style) -->
    <div id="bubble-content" class="bubble-content"></div>

    <!-- Actions (Optional Pills) -->
    <div id="bubble-actions" class="bubble-actions hidden"></div>

    <!-- Tail pointing to Wis below -->
    <div class="bubble-tail"></div>
  </div>
  <script src="bubble.js"></script>
</body>
</html>
