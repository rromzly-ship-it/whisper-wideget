<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisper Agent (Wis)</title>
  <link rel="stylesheet" href="eye.css">
</head>
<body>
  <div id="eye-container">
    <!-- Anime Anger Mark (💢) visible when Wis detects lag or error -->
    <div id="anger-mark" class="anger-mark">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="#EF4444" stroke="#DC2626" stroke-width="1.2">
        <path d="M4 8 C4 6 6 4 8 4 L8 8 Z M16 4 C18 4 20 6 20 8 L16 8 Z M20 16 C20 18 18 20 16 20 L16 16 Z M8 20 C6 20 4 18 4 16 L8 16 Z" />
        <rect x="7" y="7" width="10" height="10" fill="#DC2626" rx="2" />
      </svg>
    </div>

    <!-- Floating Sleeping Zs drifting UP and OUT of head -->
    <div id="sleeping-z-box" class="sleeping-z-box">
      <span class="z-particle zp1">Z</span>
      <span class="z-particle zp2">Z</span>
      <span class="z-particle zp3">z</span>
    </div>

    <!-- Orbiting blue cursor pointer arrow (visible when Wis glides to a screen target) -->
    <div id="pointer-orbit">
      <svg id="pointer-arrow" viewBox="0 0 24 24" width="15" height="15">
        <path d="M12 1.5 L20.5 20.5 L12 16 L3.5 20.5 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </div>

    <div id="eye-circle" class="state-idle" title="Whisper Agent (Wis) — Klik sekali untuk ngobrol atau perintah langsung">
      <canvas id="eye-canvas" width="168" height="168"></canvas>
    </div>
  </div>
  <script src="eye.js"></script>
</body>
</html>
